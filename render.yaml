services:
  - type: web
    name: socio-digital
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Rota de saúde própria, servida pelo backend. Apontar o health check para
    # "/" fazia a verificação depender do HTML da SPA — e qualquer falha ali
    # marcava o serviço como indisponível, momento em que a Render passa a
    # mostrar a página dela no lugar do site.
    healthCheckPath: /healthz

    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"

      # Opcional. Sem ela o backend usa RENDER_EXTERNAL_URL, que a plataforma
      # injeta sozinha. Só preencha se o frontend for servido em outro domínio.
      - key: FRONTEND_URL
        sync: false

      # Caminho do SQLite. Aponte para dentro de um disco persistente, senão o
      # banco é recriado a cada deploy.
      - key: SQLITE_PATH
        sync: false

      - key: OAUTH_STATE_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CONTAAZUL_CLIENT_ID
        sync: false
      - key: CONTAAZUL_CLIENT_SECRET
        sync: false
      - key: CONTAAZUL_REDIRECT_URI
        sync: false
      - key: CONTAAZUL_SCOPES
        value: openid profile aws.cognito.signin.user.admin
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: WHATSAPP_SEND_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
