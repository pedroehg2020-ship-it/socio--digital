services:
  - type: web
    name: socio-digital
    runtime: docker
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SQLITE_PATH
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CONTAAZUL_CLIENT_ID
        sync: false
      - key: CONTAAZUL_CLIENT_SECRET
        sync: false
      - key: CONTAAZUL_REDIRECT_URI
        sync: false
      - key: CONTAAZUL_SCOPES
        value: openid profile aws.cognito.signin.user.admin
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: WHATSAPP_SEND_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
